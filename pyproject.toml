[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-paradox"
version = "0.1.0"
description = "Carbon-aware grid forecasting project for DSAN 5550."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "codecarbon>=2.3",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyshp>=2.3",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "xgboost>=2.0",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "matplotlib>=3.8",
]
